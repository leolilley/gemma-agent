# Measurement cohorts. Task ids are from data/tasks.jsonl.
# Three cohorts in order (noise floor, grid, size), then only repeats: docs/PLAN.md "Cohort discipline".
# One entry = one bundle on one site. The dispatch tool reads bundle, site, repeats and tasks and nothing else;
# the regeneration script reads the rest (rerun_of). Inline lists only: the reader is the flat one in dispatch_run.py.
# Grid task set (v0.3.0, 2026-10-14): the 68 tasks sound on BOTH lanes, i.e. in the measurement notebook's Docker-lane
# audit (reference/mbyt-soundness, 114 of 129) AND in our Kaggle-lane audit (results/kaggle/lane-audit-2, the harness's
# verify_task with empty and gold controls under sandbox=subprocess): rich 39, fastapi 29. requests (0 of 13) and
# httpx (0 of 1) are unsound on the Kaggle lane because its subprocess sandbox grades the image's own package;
# they stay in the Docker-only noise floor. Table: docs/results/lane-soundness.csv; list: docs/results/gpu-lane-tasks.json.
category: "gemma-agent"
version: "0.6.0"
description: "Cohorts for the measurement grid; the dispatch tool walks them in order."
cohorts:
  # 1. Noise floor: one identity, same tasks, 5 repeats. API lane (Docker sandbox) since 2026-10-13.
  noise_floor_requests:
    bundle: bf18
    site: local-docker-api
    repeats: 5
    tasks: [requests_6644, requests_7205, requests_7309, requests_7315, requests_7328, requests_7427, requests_7505, httpx_3672]
  # 2. Grid: precision (4-bit, bf16) x budget (cell, lifted) on the 68 both-lane tasks, on the free L4x4 notebook.

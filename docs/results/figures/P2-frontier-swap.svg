<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
<rect width="860" height="400" fill="#fcfcfb"/>
<text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold">The frontier swap: who wrote the history, who reads it</text>
<text x="24" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Share of next calls that repeat the history's last call. One greedy and four sampled completions per cut; no tool runs.</text>
<rect x="24" y="74" width="178" height="30" rx="6" fill="none" stroke="#52514e" stroke-width="1"/>
<text x="113.0" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">1. Take a recorded attempt</text>
<path d="M208,89 h18 m-6,-5 l6,5 l-6,5" fill="none" stroke="#52514e" stroke-width="1.5"/>
<rect x="234.0" y="74" width="214" height="30" rx="6" fill="none" stroke="#52514e" stroke-width="1"/>
<text x="341.0" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">2. Cut its history before call k</text>
<path d="M454,89 h18 m-6,-5 l6,5 l-6,5" fill="none" stroke="#52514e" stroke-width="1.5"/>
<rect x="480.0" y="74" width="280" height="30" rx="6" fill="none" stroke="#52514e" stroke-width="1"/>
<text x="620.0" y="94" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">3. Hand it to another model for call k only</text>
<text x="559.0" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e" text-anchor="middle" font-weight="normal">Model that reads the history and makes the next call</text>
<text x="385.0" y="164" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Base E4B</text>
<text x="559.0" y="164" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">The other adapter</text>
<text x="733.0" y="164" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">The adapter that wrote it</text>
<text x="286" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold">Looping history</text>
<text x="286" y="229.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="normal">written by an adapter, 23 cuts</text>
<rect x="300" y="176" width="170" height="74" rx="4" fill="#b7d3f6"/>
<text x="385.0" y="222.0" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#0b0b0b" text-anchor="middle" font-weight="bold">5%</text>
<rect x="474" y="176" width="170" height="74" rx="4" fill="#86b6ef"/>
<text x="559.0" y="222.0" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#0b0b0b" text-anchor="middle" font-weight="bold">18%</text>
<rect x="648" y="176" width="170" height="74" rx="4" fill="#1c5cab"/>
<text x="733.0" y="222.0" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">50%</text>
<text x="286" y="289.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="bold">Clean history</text>
<text x="286" y="307.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="normal">written by the 31B or the base, 55 cuts</text>
<rect x="300" y="254" width="170" height="74" rx="4" fill="#cde2fb"/>
<text x="385.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#0b0b0b" text-anchor="middle" font-weight="bold">1%</text>
<rect x="474" y="254" width="344" height="74" rx="4" fill="#cde2fb"/>
<text x="646.0" y="293.0" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#0b0b0b" text-anchor="middle" font-weight="bold">2%</text>
<text x="646.0" y="313.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="normal">either adapter</text>
<text x="24" y="358" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">On looping histories, base minus the adapter that wrote them: −46 points (90% interval −65 to −27, task bootstrap).</text>
<text x="24" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">The base rarely continues an adapter's loop, an adapter continues its own far more than another's, and on clean ones all repeat on 3% or less.</text>
</svg>

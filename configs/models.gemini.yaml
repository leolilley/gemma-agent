# Model registry for LOCAL evaluation only (swegemma eval --models-yaml).
#
# Routes the competition's quantized model aliases to Google's OpenAI-compatible
# Gemini endpoint, which serves the full-precision Gemma 4 instruction models on
# the free tier. This is the paper's "full precision" arm. The scorer runs the
# 4-bit QAT checkpoints on 4x L4 through vLLM; that arm runs in Kaggle notebooks.
#
# No key lives in this file. The harness falls back to LITELLM_API_KEY
# (or OPENAI_API_KEY) from the environment or a .env file in the working directory.
models:
  gemma-4-31b-it-qat-w4a16-ct:
    path: openai/gemma-4-31b-it
    api_base: https://generativelanguage.googleapis.com/v1beta/openai
  gemma-4-12b-it-qat-w4a16-ct:
    path: openai/gemma-4-12b-it
    api_base: https://generativelanguage.googleapis.com/v1beta/openai
  gemma-4-e4b-it-qat-w4a16-ct:
    path: openai/gemma-4-e4b-it
    api_base: https://generativelanguage.googleapis.com/v1beta/openai
  gemma-4-e2b-it-qat-w4a16-ct:
    path: openai/gemma-4-e2b-it
    api_base: https://generativelanguage.googleapis.com/v1beta/openai
